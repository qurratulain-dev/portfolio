<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts are requested as variable weight ranges (400..800 / 400..700)
         rather than as separate discrete weights. Google resolves both forms to
         the exact same woff2 files, but the range form emits 13 @font-face
         blocks instead of 53 and a 4.9 kB stylesheet instead of 19.3 kB. The
         render-blocking CSS is ~14 kB smaller for an identical paint, and every
         weight the design actually uses still resolves. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&family=JetBrains+Mono:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <title>Quratulain | Full Stack Developer | Laravel &amp; React Expert</title>

    <!-- ============================================================
         SEO / social metadata

         Canonical origin is https://qurratulain-naseem.vercel.app/ and it
         is the root of the site (vite `base: '/'`), so every absolute URL
         below is origin-rooted - no path prefix.

         Why Vercel and not GitHub Pages:
           - commit df640ab "fix: update base path for vercel deployment"
             changed vite `base` from '/Qurat_Portfolio/' to '/'; a
             root-domain base only works on a root-hosting platform
           - the GitHub repo's own "homepage" field is
             https://qurratulain-naseem.vercel.app
           - GitHub Pages is NOT enabled on the repo (has_pages: false),
             so the old qurratulain-dev.github.io URL serves nothing
           - the repo is named `portfolio`, so even if Pages were on,
             .../Qurat_Portfolio could never resolve
         package.json "homepage" was left on the old Pages URL; it has
         been corrected to match. If the domain ever changes, update the
         canonical, og:url, the two image URLs and the JSON-LD url in
         one pass - they are the only origin-bearing values here.
         ============================================================ -->
    <link rel="canonical" href="https://qurratulain-naseem.vercel.app/" />
    <meta
      name="description"
      content="Quratulain Naseem, full-stack developer in Gujranwala, Pakistan, building multi-tenant SaaS platforms, REST APIs and payment systems with Laravel and React."
    />
    <meta name="author" content="Quratulain Naseem" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph. og:image is the only raster asset these crawlers ever see,
         which is why it is the one place a PNG was still costing 693 kB.
         It is a photograph, so it ships as JPEG: 86.8 kB at quality 90
         (PSNR 48.6 dB vs the source, i.e. imperceptible) with identical
         1024x1536 framing. JPEG rather than the WebP the page itself uses,
         because og:image support for WebP/AVIF is not universal across
         Facebook, LinkedIn and the chat/IM unfurlers, and a preview that
         silently fails to render is far worse than a few extra kB.
         The page portrait is separate: a 26 kB WebP crop loaded only in the
         About section (see LeftAbout.jsx). -->
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Quratulain Naseem" />
    <meta
      property="og:title"
      content="Quratulain | Full Stack Developer | Laravel &amp; React Expert"
    />
    <meta
      property="og:description"
      content="Quratulain Naseem, full-stack developer in Gujranwala, Pakistan, building multi-tenant SaaS platforms, REST APIs and payment systems with Laravel and React."
    />
    <meta property="og:url" content="https://qurratulain-naseem.vercel.app/" />
    <meta
      property="og:image"
      content="https://qurratulain-naseem.vercel.app/og-image.jpg"
    />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="1536" />
    <meta property="og:image:alt" content="Portrait of Quratulain Naseem, full-stack developer" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter/X. The card is `summary` rather than `summary_large_image`
         because the only real image asset is a 1024x1536 portrait (0.67:1);
         the large-image card crops to 1.91:1 and would slice a thin band
         out of it. Swap to summary_large_image once a 1200x630 card
         image exists. -->
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="Quratulain | Full Stack Developer | Laravel &amp; React Expert"
    />
    <meta
      name="twitter:description"
      content="Quratulain Naseem, full-stack developer in Gujranwala, Pakistan, building multi-tenant SaaS platforms, REST APIs and payment systems with Laravel and React."
    />
    <meta
      name="twitter:image"
      content="https://qurratulain-naseem.vercel.app/og-image.jpg"
    />
    <meta
      name="twitter:image:alt"
      content="Portrait of Quratulain Naseem, full-stack developer"
    />

    <!-- Icons. favicon.png and apple-touch-icon.png are both cut from the
         portrait master in src/assets/profile-source.png (head crop,
         x470 y45 370x370), so they are derivatives of a real asset in the
         repo rather than invented artwork. They fix a 404: the old
         <link rel="icon"> pointed at a favicon.png that did not exist, and
         the old apple-touch-icon pointed at the full 1024x1536 portrait,
         which iOS would centre-crop to the torso. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
