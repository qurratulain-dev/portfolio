    <script>
      /* Theme bootstrap — runs before first paint so the correct palette is on
         <html> already, which is what prevents a flash of the wrong theme.
         Kept inline, tiny and dependency-free on purpose; it mirrors the
         resolution order in src/hooks/useTheme.js:
           1. explicit user choice in localStorage
           2. OS / browser preference (prefers-color-scheme)
           3. dark, the default identity
         Every access is guarded so blocked storage or a missing matchMedia can
         never break the page. */
      (function () {
        var root = document.documentElement;
        try {
          var KEY = "portfolio-theme";
          var stored = null;
          try {
            stored = window.localStorage.getItem(KEY);
          } catch (e) {}

          var theme =
            stored === "dark" || stored === "light"
              ? stored
              : window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";

          root.setAttribute("data-theme", theme);
        } catch (e) {
          root.setAttribute("data-theme", "dark");
        }
      })();
    </script>
